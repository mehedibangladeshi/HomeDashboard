project_id = "home-management"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/**", "io.homemanagement.app://login-callback"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "1MiB"

[functions.reminder-dispatch]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

# These endpoints authenticate using OAuth state or an internal worker secret.
[functions.google-calendar-callback]
verify_jwt = false

[functions.sync-google-calendar]
verify_jwt = false
